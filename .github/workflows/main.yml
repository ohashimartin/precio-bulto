name: Actualizar precios

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Recolectar Maxiconsumo
        run: python scrapers/maxiconsumo.py
      - name: Recolectar ofertas de Yaguar (si lo permite)
        run: python scrapers/yaguar.py
        continue-on-error: true
      - name: Normalizar y armar la web
        run: |
          python scrapers/normalizar.py
          python scrapers/construir_web.py
      - name: Guardar los datos nuevos
        run: |
          git config user.name "actualizador-precios"
          git config user.email "actions@users.noreply.github.com"
          git add data web/index.html
          git diff --staged --quiet || git commit -m "Precios del $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
